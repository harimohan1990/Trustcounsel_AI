[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008", # FastAPI dependency injection with Depends() in function parameters
    "B904", # Allow raise ... without from e inside handlers where clean message is needed
    "E501", # Line length (legal strings & citations)
    "E712", # Comparison to True in SQLAlchemy binary expressions (e.g. User.is_active == True)
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
